version: '3.8'
services:
  api-service:
    build: .
    container_name: spring_api
    ports:
      - "8080:8080"
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://host.docker.internal:5432/prueba_tecnica_accenture
      - SPRING_R2DBC_USERNAME=admin
      - SPRING_R2DBC_PASSWORD=Admin123@
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure